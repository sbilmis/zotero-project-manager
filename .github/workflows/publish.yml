name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-scope:
    name: Determine release components
    runs-on: ubuntu-latest
    outputs:
      publish_cli: ${{ steps.scope.outputs.publish_cli }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check release tag against component versions
        id: scope
        env:
          ZPM_RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python scripts/release_scope.py

  build:
    name: Build distributions
    needs: release-scope
    if: needs.release-scope.outputs.publish_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install build
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release-scope, build]
    if: needs.release-scope.outputs.publish_cli == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zotero-project-manager
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
